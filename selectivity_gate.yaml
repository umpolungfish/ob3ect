entities:
  - "the semantic selectivity gate: the live-loop counterpart of semantic branch verification that grades an open answer against a correctness schema it synthesizes on the fly. Frobenius closure, mu circ delta equals id, guarantees only balance, that every FSPLIT is rejoined by FFUSE so no charge is lost, and balance is automatic and cannot fail, so it is not a correctness signal; selectivity is the separate question of whether the correct branch was selected during recombination. With no predefined schema the gate performs an adversarial examiner pass that states what any correct answer MUST satisfy and MUSTNOT violate, refusing to assume the question's premise is true, then runs two verification arms: EVALT for isomorphic match against the MUST criteria yielding assertibility, and EVALF for collision detection of any MUSTNOT violation or internal self-contradiction yielding deniability. The two arms fold to Belnap FOUR exactly as the kernel dialetheia gates do: assertible and not deniable is True, deniable and not assertible is False, both together is the dialetheic Both, neither is the vacuous Neither. Because False and Both are reachable the gate can fail, and that reachable failure is what distinguishes selectivity from the balance harness that never fails. With full Frobenius closure and Lean 4 verification scaffold."
