# ob3ect batch: the Semantic Selectivity Gate for MoDoT — the live-loop
# counterpart of the semantic_branch_verifier ob3ect. Auto-design it through
# the Grammar instead of hand-cobbling it: Frobenius closure (mu.delta=id) is
# BALANCE and never fails; SELECTIVITY (was the correct branch selected?) is the
# separate verdict that CAN fail. Lands beside semantic_branch_verifier so the
# runtime gate in modot/selectivity.py can be re-derived as a faithful port of a
# procedurally-sourced, Grammar-typed ob3ect (scaffold-build-on-it), not invented.
#
# Run:  cd /home/mrnob0dy666/imsgct/ob3ect && python3 auto.py -f selectivity_gate.yaml

