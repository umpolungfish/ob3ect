# ob3ect territory-map 3/4 — the ARTIFACT-DISCIPLINE / SELF-DIAGNOSTIC region.
# The recurring hazard: naive integer-relation searches manufacture GHOST algebraic
# facts that vanish under higher precision. This build has been fooled repeatedly:
#   sqrt30 -> sqrt26 -> sqrt13 (base field); deg 26, 48, 68, 139 (coordinate degree);
#   a spurious degree-8 modulus compositum; z3/z9 falsely placed in Q(sqrt2,sqrt13).
# Each ghost was READ and became the next obligation (the imscribing R/W/X pattern).
# This map turns "is this relation real?" into an explicit, routed discipline so the
# Grammar flags its own holes and localizes them, rather than trusting a lucky fit.
# Run:  cd ~/imsgct/ob3ect && python3 auto.py -f d12_map3_artifact_discipline.yaml

name: d12-map-artifact-discipline
out_dir: digital

design:
  scope: mesoscale
  provider: openrouter
  model: google/gemini-3-flash-preview
  retries: 2
  temperature: 1.0
  thinking: false
  context: /tmp/claude-1000/-home-mrnob0dy666-imsgct/2df909c9-a04e-4a42-8433-903523348079/scratchpad/d12_ctx

entities:
  # ── the invariant that separates a real relation from a ghost ─────────────
  - "a candidate algebraic relation found by lindep becomes certified-genuine only when its degree divides the known field degree 288 AND its coefficient height stays bounded as working precision is doubled, so a relation that creeps or has non-dividing degree is flagged as an artifact"

  # ── the both-register status of an unverified fit ─────────────────────────
  - "an integer-relation fit that reconstructs numerically but has runaway denominators becomes a Belnap B-state, simultaneously true-at-low-precision and false-at-high-precision, resolved only by the doubling test rather than accepted as a coordinate"

  # ── the self-diagnostic that localizes the hole ───────────────────────────
  - "the build's own consistency check becomes a routine that, on encountering a ghost relation, both flags THAT a coordinate is unverified and localizes WHICH field-degree constraint it violated, turning a silent wrong answer into a precisely placed open obligation"

  # ── precision as the discriminator, made computable ───────────────────────
  - "the decision of how many significant digits certify a given coordinate becomes the exact function of field degree and target height, so every exactness claim carries the precision at which it was checked and the precision at which it would break if false"

  # ── the audit trail from wrong field guess to next obligation ─────────────
  - "each superseded field guess sqrt30 sqrt26 sqrt13 becomes a recorded read whose refutation defined the next probe, so the sequence of wrong answers is an explicit convergence trajectory rather than discarded noise"
