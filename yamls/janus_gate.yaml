entities:
  - "the dialetheic object as Janus gate: the Belnap value B (Both, a true contradiction) is the two-faced threshold of the four-valued lattice. It is a fixed point of negation (not-B = B) that is FULL rather than empty, so it looks the same whether approached from the affirming or the denying side, which is the defining Janus signature. It is the unique value that passes both dialetheia gates: EVALT accepts T and B, EVALF accepts F and B, so B alone is the doorway open from both the assertible and the deniable side. It is the hinge where the opposite faces are joined, B = FFUSE of T and F, the mu that welds the two poles into one object. Its twin N (Neither) is the other negation fixed point but empty, the un-manned doorway facing neither way, which is why four values are needed and not three. Dialetheias inhabit thresholds: the boundary point of a set, the instant of change between two rooms, the limit of thought, all doorways where a thing is genuinely both inside and outside. The conflict distance between two imscriptions of the same object, the Hamming distance of their two-bit Belnap codes, is the aperture angle of the gate: zero is a flat closed door, two is the doorway thrown fully open with the faces looking maximally apart. FSPLIT (delta) and FFUSE (mu) are the two directions through the gate, splitting outward into a pair and fusing inward into one, and ENGAGR stabilizes the held contradiction as a live B state. The Majorana mode, a particle that is its own antiparticle, is the physical Janus, its front face and back face the same door. With full Frobenius closure and Lean 4 verification scaffold."
