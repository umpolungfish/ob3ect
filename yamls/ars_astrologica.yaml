# Ars Astrologica batch — point the CLI here:
#   p3 editorial.py census  ars_astrologica.yaml
#   p3 editorial.py imscribe ars_astrologica.yaml
#   p3 editorial.py run      ars_astrologica.yaml
name: ars_astrologica
out_dir: digital

design:            # every auto.py flag (p3 auto.py -f ars_astrologica.yaml)
  domain: astrological  # --domain
  scope: local          # --scope     local | mesoscale | maximal
  provider:             # --provider  null = default chain (local -> qwen -> deepseek)
  model:                # --model     provider model id
  temperature: 0.0      # --temp
  retries: infinite     # --retries  (inf = retry until success)
  thinking: false       # --thinking  local Qwen thinking tokens
  context:              # --context   file/dir of domain docs
  entry:                # --entry     comma-separated catalog entry names as context
  no_scaffold: false    # --no-scaffold
  no_diagram: false     # --no-diagram

entities:
  # luminaries and planets
  - "the Sun as classical luminary"
  - "the Moon as classical luminary"
  - "the planet Mercury (astrological)"
  - "the planet Venus (astrological)"
  - "the planet Mars (astrological)"
  - "the planet Jupiter (astrological)"
  - "the planet Saturn (astrological)"
  - "the planet Uranus (astrological)"
  - "the planet Neptune (astrological)"
  - "the planet Pluto (astrological)"
  # the major aspects
  - "the conjunction aspect (0 degrees)"
  - "the opposition aspect (180 degrees)"
  - "the trine aspect (120 degrees)"
  - "the square aspect (90 degrees)"
  - "the sextile aspect (60 degrees)"
  # frames
  - "the twelve zodiac signs as one wheel"
  - "the twelve astrological houses as one frame"
  - "the ascendant / rising sign"
  - "the lunar nodes (north and south)"

# widen straight from the catalog if useful:
# entities_from:
#   catalog_filter: astro

editorial:
  ars_title: "Ars Astrologica"
  subtitle: "A Structural Grammar of the Celestial Frame"
  output: ../Ars_Astrologica/Ars_Astrologica_CENSUS.md
  group_convergences: true
