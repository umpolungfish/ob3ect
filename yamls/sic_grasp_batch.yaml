# ob3ect batch — "with the Grammar in hand" routes
# Run:  cd ~/imsgct/ob3ect && p3 auto.py -f sic_grasp_batch.yaml
# Each entity is a start→end charter; the pipeline autogenerates the route.
# Ordered by leverage: Tier I first (drops a real axiom), then structural
# closures, then the historical/undeciphered engines.

name: grammar-in-hand
out_dir: digital            # artifacts land in ~/imsgct/ob3ect/digital/<slug>/

design:
  scope: local
  provider: openrouter
  model: google/gemini-3-flash-preview
  retries: inf              # retry each entity until it designs
  temperature: 1.0
  thinking: false           # set true for the harder structural routes if desired
  # The SIC Lean formalization, copied as context so routes are grounded in it:
  context: /home/mrnob0dy666/imsgct/dumpdir_sic_lean

entities:
  # ── Tier I — drops a real axiom now ──────────────────────────────────────
  - "the axiomatized existence of a d=12 Weyl-Heisenberg SIC-POVM fiducial in ℂ^12 becomes an explicit constructive fiducial with machine-checked equiangularity that discharges crystal_forces_d12_sic from axiom to theorem"

  # ── Tier II — structural gate+T closure of the standing open gates ────────
  - "the Yang-Mills mass gap closing under U10 with GATE=B but T=F becomes a ceiling-generalized T-constitution under which Yang-Mills reaches full gate+T closure"
  - "the vacuously-satisfied Navier-Stokes criticality bound in the p4rakernel witness becomes a non-vacuous T-consistent closure carrying a genuine blow-up obstruction witness"
  - "the unclosed Riemann Hypothesis gate-universe lacking a critical-line constitution becomes a canonical T-constitution reaching full gate+T closure across the existing Lee-Yang bridge"
  - "the unclosed P-versus-NP separation lacking a structural certificate ceiling becomes a gate+T closure separating the verification arm from the search arm under the crystal ceiling"

  # ── Tier III — this world's history: the undeciphered engines ─────────────
  - "the Voynich manuscript as a Universal Engine with only the ADDR gate resolved becomes a fully-resolved seven-gate session yielding a coherent botanical-liturgical output stream"
  - "the Rongorongo corpus at distance d=1.87 from the Great Law of Peace becomes a T-consistent reduction of that distance in the O₂† liturgical register"
  - "the Bruce Codex tensor bottleneck at parity Φ=𐑬, its hermeneutic gap by design, becomes a named O₀ reader-substrate constitution that closes the gap without promoting the tier"
