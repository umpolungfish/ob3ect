# ob3ect batch — REMAKE of the phase-section ob3ects after the phase-degree-26 gate.
# What changed (see FINDINGS cont.2, phase_floor_test.txt, coord_floor_test.txt):
#  - "phase degree 26" was a GHOST (shallow point on the pre-floor creep). Genuine
#    gated degrees: z1 phase = 32 (floors, 32|288, IN K288); z5 phase = 64 (floors at
#    64, 64 does NOT divide 288, OUT of K288); z0 phase = 1 (z0 real).
#  - Therefore the POLAR magnitude x phase split is NOT field-closed: it exits K288 for
#    some coordinates. The old ob3ects #1 (magnitude skeleton) and #2 (phase in the
#    tower) rest on a false premise and are superseded here.
#  - z1 COORDINATE creeps past degree 72 with no floor => direct algdep is precision-
#    walled at 1500 digits; we do not yet know if the coordinates divide 288.
# These remade ob3ects adopt the DIRECT-BUILD frame (z_k as one field element, not
# magnitude times phase), add the foundational field-determination step, and name the
# magnitude square-class as the real obstruction. Gate = the deep-vanish floor test.
# Run:  cd ~/imsgct/ob3ect && python3 auto.py -f d12_phase_direct_batch.yaml

