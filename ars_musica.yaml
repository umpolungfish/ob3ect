# Ars Musica batch — point the CLI here:
#   p3 editorial.py census  ars_musica.yaml
#   p3 editorial.py imscribe ars_musica.yaml
#   p3 editorial.py run      ars_musica.yaml
name: ars_musica
out_dir: digital

design:
  domain: musical
  scope: local
  temperature: 0.4
  retries: 3

entities:
  # the twelve chromatic intervals
  - "the perfect unison interval"
  - "the minor second interval"
  - "the major second interval"
  - "the minor third interval"
  - "the major third interval"
  - "the perfect fourth interval"
  - "the tritone interval"
  - "the perfect fifth interval"
  - "the minor sixth interval"
  - "the major sixth interval"
  - "the minor seventh interval"
  - "the major seventh interval"
  - "the perfect octave interval"
  # modes and scales
  - "the Ionian (major) mode"
  - "the Dorian mode"
  - "the Phrygian mode"
  - "the Lydian mode"
  - "the Mixolydian mode"
  - "the Aeolian (natural minor) mode"
  - "the Locrian mode"
  - "the harmonic minor scale"
  # tuning systems
  - "equal temperament tuning"
  - "just intonation tuning"
  - "Pythagorean tuning"
  # structure
  - "the harmonic overtone series"
  - "the circle of fifths"
  - "consonance and dissonance as a pair"

# entities_from:
#   catalog_filter: harmon

editorial:
  ars_title: "Ars Musica"
  subtitle: "A Structural Grammar of Harmony and Time"
  output: ../Ars_Musica/Ars_Musica_CENSUS.md
  group_convergences: true
