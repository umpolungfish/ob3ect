# ob3ect batch: the objects the Erdős corpus needs and does not have.
#
# Eleven of these exist because a statement had to leave the batch files on
# 2026-08-12: it named a quantity the development cannot express, which is why
# the placeholder standing in its place asserted something true of everything.
# The twelfth is the rung bound, which settles Erdős–Straus on the surviving
# class.
#
# Each entity names the object wanted and no candidate for it. The catalog
# entries under `entry` are the context, taken from the catalog by name.
#
# Run:  cd ~/imsgct/ob3ect && bash nests/erdos_objects/run.sh
# The lane is named here and the key comes from the environment. Leaving the
# lane empty let the chain fall through to a local model that returns malformed
# JSON and then to a provider with no credit, which is how a batch reports
# 'all providers failed' while a working key sits unused in the environment.
name: erdos_objects
out_dir: digital/erdos_objects
design:
  domain: computational
  scope: mesoscale
  provider: deepseek
  model: deepseek-v4-pro
  temperature: 0.0
  retries: infinite
  thinking: false
  context: /home/mrnob0dy666/imsgct/ig-docs/erdos_corpus_index.md
  entry: ramsey_numbers_general, ramsey_number, ramsey_number_odd_cycle, ramsey_3_hypergraph, generic_graph, bipartite_graph, hamiltonian_cycle, hypergraph_turan_density, hypergraph_chromatic, sphere_packing_density_open, steiner_tree_problem, continuum_hypothesis, erdos_straus_conjecture
  no_scaffold: false
  no_diagram: false
entities:
- the least vertex count forcing a monochromatic copy of one of two given graphs, as a structural ob3ect
- the least edge count of a host graph forcing a monochromatic copy of a given graph, as a structural ob3ect
- the lift carrying a hypergraph Ramsey lower bound from one uniformity to the next, as a structural ob3ect
- the maximum edge count of a graph admitting no two cycles without a shared edge, as a structural ob3ect
- the largest girth available to a graph of given order and chromatic number, as a structural ob3ect
- the proportion of the plane covered by an arrangement of congruent discs, as a structural ob3ect
- the growth exponent of the mean-square displacement of a self-avoiding walk, as a structural ob3ect
- the count of four-block six-point configurations in a Steiner triple system, as a structural ob3ect
- a partition relation on uncountable ordinals holding in one model of set theory and failing in another, as a structural ob3ect
- the least order of a bipartite graph whose list chromatic number exceeds a given bound, as a structural ob3ect
- the joint logarithmic growth of the least common multiple of an initial segment and the largest permutation order on that many symbols, as a structural ob3ect
- the least rung at which the ladder product of an integer congruent to one modulo twenty-four carries a divisor at minus one, and its bound in the integer alone, as a structural ob3ect
