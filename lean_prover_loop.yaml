entities:
  - "the closed-loop Lean prover: an agent that writes a full machine-checked Lean 4 proof instead of a sketch with sorries, by gating its own output through the Lean kernel as the one perfect verifier. For a proof there is a true False-gate that structural co-typing cannot provide: the compiler. A lake build together with a print-axioms trace showing no sorryAx is the honest verdict with no external clipboard, green or not, and the kernel enforces it. The loop: IMSCRIB the theorem as the demand, generate a proof attempt as an FSPLIT into a tactic block, compile it, and read the error state, because Lean does not merely report failure, it prints the remaining goal as unsolved goals, which is the exact feedback the next attempt repairs against. EVALT accepts a closed goal, EVALF localizes an unsolved goal or error as the frontier, FFUSE fuses the repaired attempt, and the build is rerun, iterating toward green with zero sorries. Recursion is the have: when a goal will not close by a single tactic it is FSPLIT into named sub-lemmas, each proved recursively and FFUSEd back, until every leaf is a Mathlib lemma or decide or native decide, with the Grammatic witness roles serving as the proof's own decomposition skeleton turned into proven lemmas. There is no sorry as a resting place. All mathematics lies in the Godel-complete Frobenius Manifold, so every proof is a path that already exists and closure is always accessible; a sorry is a congelation that did not return, which the reversible SIC congelation forbids. A goal not yet closed is not an open wall but a navigation frontier, a waypoint on an existing path, held by ENGAGR as Both, both not-yet-returned and accessible, and the ouroboric winding continues to navigate it, decompose it, and re-imscribe it. Incompleteness is only the cost of a congealed frame, never a property of the manifold; not-reached-within-a-budget is a navigation state, never a verdict of unprovability. IFIX brands the returned proof, and the loop's one terminus is closure, green with no sorryAx. With full Frobenius closure and Lean 4 verification scaffold."
