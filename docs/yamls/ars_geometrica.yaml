# ─────────────────────────────────────────────────────────────────────────────
# Ars batch skeleton — copy, fill, run. Two independent pipelines read this file;
# neither concerns the other. Every CLI flag of each pipeline is a YAML key here.
#
#   p3 auto.py -f <this>.yaml          # imscribe pipeline (design every entity; LLM)
#   p3 editorial.py <this>.yaml        # editorial pipeline (assemble census; catalog only)
#
# RIGOR: editorial reads tuples from the IG catalog (machine-sourced); it never
# hand-imscribes. Uncatalogued entities are pending, not guessed.
# ─────────────────────────────────────────────────────────────────────────────

name: ars_geometrica           # batch id, e.g. ars_something
out_dir: digital # imscribe pipeline: where ob3ect JSONs / scaffolds / diagrams are written

# ── entities (both pipelines read these) ─────────────────────────────────────
entities:
  - regular_tetrahedron
  - cube
  - platonic_solids
  - cat0_cube_complex
  - polytope_commutator_algebra
  - convexity_constraint
  - caratheodory_theorem
  - curvature_line_global_structure
  - hopf_conjecture_positive_curvature
  - poincare_conjecture
  - hodge_conjecture
  - hilbert_sixteenth_problem
  - fujita_conjecture
  - thurston_eight_geometries
  - H3_geometry
  - H2xR_geometry
  - exotic_mathematics
  - fractal_structure
  - ford_circles
  - aspherical_2d_cw_complex

entities_from:
  file:            # path to a file of entities, one per line (# comments allowed)
  catalog_filter:  # substring; pulls catalog names/descriptions that match

# ── imscribe pipeline: every auto.py flag ────────────────────────────────────
# (p3 auto.py -f <yaml>).  Each key below maps 1:1 to an auto.py CLI flag.
design:
  domain: mathematical         # --domain    domain hint (mathematical | musical | linguistic | astrological | biological | ...)
  scope: local     # --scope     local | mesoscale | maximal
  provider:        # --provider  null = default chain (local -> qwen -> deepseek); or openrouter | deepseek | local
  model:           # --model     model id for the provider (e.g. deepseek-chat, qwen3-235b-a22b)
  temperature: 0.0 # --temp      sampling temperature
  retries: 100000       # --retries   max design retries per entity
  thinking: false  # --thinking  enable <thinking> tokens in the local Qwen model
  context:         # --context   file or dir of domain docs to include as context (.md/.txt/.lean/.py/.tex/.json)
  entry:           # --entry     comma-separated catalog entry names to inject as context (e.g. yhwh,proton)
  no_scaffold: false # --no-scaffold  do not write the per-entity Lean scaffold (.lean)
  no_diagram: false  # --no-diagram   do not write the per-entity 