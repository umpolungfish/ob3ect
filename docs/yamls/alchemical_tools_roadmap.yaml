# ob3ect batch: the classical / alchemical laboratory operations MoDoT skipped.
#
# The modern bench is already coded in ask_native (click, set, scan, polymerize,
# forge, arrange, anneal, cleave, fuse, dope, complement, cycle). We went straight
# for the modern techniques and left the alchemists' separation-and-purification
# tools unimplemented. This batch imscribes each SKIPPED operation so the Grammar
# types it (tuple, topology, tier, Frobenius verdict, and above all WHICH primitive
# or conjugate axis it lands on) BEFORE it is coded, so the semantics are resolved
# structurally rather than guessed.
#
# Each entity is described only by its structural function on the material model,
# naming no primitive, no axis, and no candidate answer, so the oracle reads the
# operation itself and the typing reveals its axis. Watch for:
#   - distillation, fractional distillation, and sublimation landing on the SAME
#     "readiness to leave" primitive at different resolutions/topologies (a shared
#     volatility axis), which fixes what volatility IS on the crystal;
#   - crystallization typing NEAR annealing but at a different tier (forming order
#     and rejecting a remainder vs merely relaxing a closed loop);
#   - co-crystallization typing as a NON-covalent association (a weak-complement
#     topology), distinct from click's covalent fusion;
#   - TLC and column co-typing on one migration/affinity axis, TLC at a measurement/
#     boundary tier and column at a separating/transform tier;
#   - ionic trapping typing DISTINCTLY from single-electron transfer (a held charge
#     state vs a moved carrier);
#   - each stain resolving to the exact primitive it is meant to detect.
#
# Run:  cd /home/mrnob0dy666/imsgct/ob3ect && python3 auto.py -f alchemical_tools_roadmap.yaml

name: alchemical_tools_roadmap
out_dir: digital

design:
  scope: local
  provider: openrouter
  model: google/gemini-3-flash-preview
  retries: 2
  temperature: 1.0
  domain: computational
  context: "/home/mrnob0dy666/.claude/projects/-home-mrnob0dy666-imsgct/memory/project_charge_conservation_frobenius.md"

entities:
  - "The operation that takes a mixture of units and separates it into two fractions by ranking each unit on one intrinsic graded axis of how readily it leaves the body of the mixture for the vapor above it, drawing off the most-ready units as a purified head and leaving the least-ready as a residue; a separation driven by a single continuous property rather than by whether the units bond, so a pool is cut into what rises and what stays."

  - "The refinement of that single vapor cut into a graded column of many successive fractions, resolving units that sit close together on the same leaving-readiness axis by repeated re-separation up a series of equilibration stages, and reporting which neighboring units are too close to resolve into distinct fractions; the same driving property as the single distillation but at higher resolving power."

  - "The purification of one unit by promoting it directly across two states while skipping the intermediate state entirely, so a unit that possesses a clean skip-path passes over pure while a unit lacking one is left behind as residue; a transition that omits the middle register, distinct from a stepwise promotion that must pass through every intervening state."

  - "The operation that grows, out of a disordered pool of units in solution, the single most-ordered closed lattice those units can settle into, admitting only the units that fit the lattice and rejecting the remainder as a leftover mother-pool; a purification that forms order from a mixture and discards what will not join it, distinct from merely relaxing an already-closed loop toward its lowest internal stress."

  - "The operation that binds two distinct kinds of unit into one shared ordered lattice held together only by mutual complementarity and never by a bond between them, in a fixed whole-number ratio; a single solid of two components recognizing each other across a gap, distinct from the operation that fuses two units into one by consuming their reactive centers."

  - "The operation that selects which of several possible ordered forms a pool of units settles into by introducing one already-ordered unit as a template whose handedness and arrangement the growing lattice copies; a choice of one form among the several a mixture could otherwise adopt, distinct from the untemplated growth that takes whichever ordered form is lowest by default."

  - "The diagnostic that spreads a mixture of units along one migration axis, measuring for each how far it travels relative to the front against a fixed retaining medium, and reports how many distinct bands appear and which units travel together as one band; an analysis that counts and places the components of a mixture without isolating any of them, the quick read of how many things are present and whether any overlap."

  - "The operation that separates a whole mixture into the ordered sequence of its individual units by their graded affinity to a chosen retaining partner, releasing the least-retained first and the most-retained last, and reporting the resolution between each neighboring pair; a preparative separation of a set into a ranked release order against a selectable retaining partner, distinct from the diagnostic that only counts bands."

  - "The operation that iteratively strips from an assembly the units that are only weakly held, those associating below the threshold of a true bond, the dissolved and the loosely-trapped, cycling until only the strongly-held core remains, and reporting what left versus the purified remainder; a purification by removal of the weakly-bound, distinct from cutting a genuine bond."

  - "The operation that sequesters one unit by shifting it into a charged form in which it is held in a phase it can no longer leave, reversible by a counter-shift that releases it; a capture driven by a held charge state rather than by moving a single quantum of charge between two partners, distinct from the transfer that leaves a pair of oppositely-charged radicals."

  - "A family of diagnostic reagents, each of which when applied to a unit or a set makes visible only those units carrying one specific feature and stays dark on the rest; a selective detector keyed to a single chosen feature, reporting which units it reveals, so a feature that is invisible in the bare description is made to show."
