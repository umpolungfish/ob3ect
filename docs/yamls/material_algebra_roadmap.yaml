# ob3ect batch: pre-emptive plan for the MoDoT material-algebra roadmap.
#
# Already SHIPPED in ask_native (172f416, 789c634): spectral invariants baked into
# the material sheet (adjacency spectrum, spectral radius rho, gap), and the operate
# verbs forge / compare / dope / fuse. This batch imscribes the UPCOMING operations
# so the Grammar types each one (tuple, topology, tier, Frobenius verdict) BEFORE it
# is coded — the plan grounded structurally, not asserted.
#
# Each entity is described by its structural function on a ring material, neutrally,
# so the oracle reads the operation itself rather than a name we pre-chose. Watch for:
#   - cleave imscribing as the delta-split DUAL of fuse (a FSPLIT topology), the sign
#     that fission and fusion are one Frobenius pair;
#   - register/export imscribing at a boundedness / boundary tier (persistence is a
#     wall, not a transform);
#   - strain and graph-energy landing on distinct primitives (stress vs toughness).
#
# Run:  cd /home/mrnob0dy666/imsgct/ob3ect && python3 auto.py -f material_algebra_roadmap.yaml

name: material_algebra_roadmap
out_dir: digital

design:
  scope: local
  provider: openrouter
  model: google/gemini-3-flash-preview
  retries: 2
  temperature: 1.0
  domain: computational
  context: "/home/mrnob0dy666/.claude/projects/-home-mrnob0dy666-imsgct/memory/project_charge_conservation_frobenius.md"

entities:
  - "The operation that takes one closed ring and returns two closed rings by cutting the loop at a chosen junction and re-closing each arc into its own smaller ring — the exact reverse of welding two rings into one, the fission of a single cyclic material into a pair whose two spectra together account for the parent's dominant modes."

  - "The operation that takes the units of a ring and returns the cyclic ordering that minimizes accumulated bond strain around the loop — the lowest-stress arrangement the same units can close into, the relaxed ground state selected from among every ordering that rings, so a material is characterized in its settled form rather than the first order that happened to close."

  - "A single scalar read off a closed ring measuring how unevenly its bonds are loaded — the spread of junction drive around the loop, near zero when every bond carries equal tension and large when the ring is forced shut against reluctant junctions; the material's stored internal stress, the quantity annealing drives down."

  - "The operation that fixes a characterized material as a named, recallable object in a persistent library — its ring order, its adjacency spectrum, its conductance class held under a name — so a material computed once can be summoned again and operated on by that name without being respecified from its bare units."

  - "The operation that emits a characterized material as a self-contained portable object carrying its whole property sheet — the ordered units, the adjacency spectrum, the conductance class, the topology — so the material crosses to another system and reloads intact, no recomputation, the sheet itself the transferable artifact."

  - "A scalar read off a ring's adjacency spectrum as its total absolute spectral weight, the sum over the magnitudes of all its modes — a measure of the material's whole bonding richness distinct from its single dominant mode; where the spectral radius is the ring's stiffness, this is its toughness, the reserve carried in the subdominant modes."
